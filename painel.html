<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Locutor - Radiação.Net</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png">
    
    <link rel="manifest" href="./manifest-painel.json">
    <meta name="theme-color" content="#f4741f">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    
    <style>
      body { justify-content: flex-start !important; padding-top: 30px !important; }
      
      #tela-login { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 80vh; z-index: 1000; }
      .login-box { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #f4741f; padding: 40px 30px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
      .login-box img { width: 80px; margin-bottom: 20px; }
      .login-box h2 { font-weight: 900; margin-bottom: 25px; color: #fff; }
      .input-group { margin-bottom: 15px; text-align: left; }
      .input-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; font-weight: 700; }
      .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 1rem; }
      .input-group input:focus { outline: none; border-color: #f4741f; }
      .btn-login { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #f4741f; color: #fff; font-weight: 900; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
      .btn-login:hover { background: #ff8c42; }
      #msg-erro { color: #ff4c4c; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: bold; }

      /* --- ESTRUTURA DASHBOARD PANORÂMICO --- */
      #tela-dashboard { display: none; width: 100%; max-width: 1400px; margin: 0 auto; flex-direction: column; gap: 20px; }
      #tela-dashboard .title-wrapper { max-width: 100% !important; justify-content: flex-start; margin-bottom: 5px; }
      
      .dashboard-grid { display: grid; grid-template-columns: 360px 1fr; gap: 25px; align-items: start; width: 100%; }
      .dash-sidebar { display: flex; flex-direction: column; gap: 20px; }
      .dash-right-col { display: flex; flex-direction: column; height: 100%; }
      .dash-main-box { background: rgba(20, 20, 20, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); min-height: 500px; flex-grow: 1; }

      /* --- REGRAS DE TELA MÉDIA (RadioBOSS / Tablets) --- */
      @media (max-width: 1100px) {
        .dashboard-grid { grid-template-columns: 1fr; }
        .dash-sidebar { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .dash-sidebar > div { margin-bottom: 0 !important; height: 100%; }
        .dash-main-box { padding: 10px; background: none; border: none; box-shadow: none; min-height: auto; }
      }

      /* --- REGRAS DE CELULAR (Telas pequenas) --- */
      @media (max-width: 700px) {
        .dash-sidebar { display: flex; flex-direction: column; }
        #tela-dashboard .title-wrapper { flex-wrap: wrap !important; justify-content: center !important; }
        #tela-dashboard .title-wrapper > div { width: 100%; justify-content: center !important; margin-top: 10px; }
      }

      .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; gap: 6px; flex-shrink: 0; transition: all 0.3s ease; }
      .status-online { background-color: rgba(46, 125, 50, 0.2); border: 1px solid rgba(76, 175, 80, 0.5); color: #4caf50; }
      .status-autodj { background-color: rgba(255, 76, 76, 0.2); border: 1px solid rgba(255, 76, 76, 0.5); color: #ff4c4c; }
      .pulse-dot { width: 6px; height: 6px; border-radius: 50%; animation: blink 1s infinite alternate; }
      .dot-green { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
      .dot-red { background: #ff4c4c; box-shadow: 0 0 6px #ff4c4c; }

      .btn-topo { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 6px; margin-left: 5px; }
      .btn-topo:hover { background: rgba(255, 255, 255, 0.2); }
      #btn-logout:hover { background: rgba(255, 76, 76, 0.2); border-color: rgba(255, 76, 76, 0.5); color: #ff4c4c; }
      .btn-instalar-app { display: none; background: rgba(33, 150, 243, 0.2); border-color: rgba(33, 150, 243, 0.5); color: #2196F3; }
      .btn-instalar-app:hover { background: #2196F3; color: #fff; border-color: #2196F3; }

      .btn-alertas { padding: 5px 10px; border-radius: 50%; }
      .btn-alertas.ativo { background: rgba(76, 175, 80, 0.2); border-color: rgba(76, 175, 80, 0.5); color: #4caf50; }
      .btn-alertas.inativo { background: rgba(255, 76, 76, 0.2); border-color: rgba(255, 76, 76, 0.5); color: #ff4c4c; animation: pulse-red 2s infinite; }
      @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 76, 76, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(255, 76, 76, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 76, 76, 0); } }

      .pedidos-wrapper { display: flex; flex-direction: column; gap: 15px; margin-top: 0; height: 100%;}
      .section-title { font-size: 1.1rem; font-weight: 900; color: #fff; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
      .section-title::after { content: ''; flex-grow: 1; height: 1px; background: rgba(255,255,255,0.1); margin-left: 10px; }

      .enquete-form { display: flex; flex-direction: column; gap: 10px; }
      .enquete-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; }
      .enquete-input:focus { border-color: #f4741f; outline: none; }
      .btn-enquete { background: #f4741f; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px;}
      .btn-enquete:hover { background: #ff8c42; }
      .btn-encerrar { background: rgba(255, 76, 76, 0.2); border: 1px solid rgba(255, 76, 76, 0.5); color: #ff4c4c; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; transition: 0.3s; }
      .btn-encerrar:hover { background: #ff4c4c; color: #fff; }
      .stat-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
      .stat-bar-bg { width: 100%; background: rgba(255,255,255,0.1); height: 12px; border-radius: 6px; overflow: hidden; }
      .stat-bar-fill { height: 100%; background: #f4741f; width: 0%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .stat-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; color: #fff; }
      .blink { animation: blinker 1s linear infinite; color: #ff4c4c; }
      @keyframes blinker { 50% { opacity: 0; } }

      .lista-pedidos { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important; gap: 15px; align-items: start; }
      .pedido-card { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-left: 4px solid #f4741f; border-radius: 12px; padding: 12px 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 6px; transition: opacity 0.3s ease; width: 100%; height: 100%; }
      .pedido-hora { font-size: 0.7rem; color: #888; text-align: right; margin-top: -2px; font-weight: 700;}
      .pedido-nome { font-weight: 700; color: #f4741f; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;}
      .pedido-musica { font-size: 1rem; font-weight: 900; color: #fff; line-height: 1.2;}
      .pedido-recado { font-size: 0.75rem; color: #ddd; font-style: italic; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; border-left: 2px solid #666; margin-top: 2px;}
      .btn-concluir { background: rgba(244, 116, 31, 0.1); border: 1px solid rgba(244, 116, 31, 0.4); color: #f4741f; padding: 8px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.8rem; transition: all 0.3s; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 6px; }
      .btn-concluir:hover { background: #f4741f; color: #fff; border-color: #f4741f; }
      .sem-pedidos { text-align: center; color: #888; font-size: 1rem; padding: 30px 0; background: rgba(20,20,20,0.5); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); grid-column: 1 / -1; }
    </style>
  </head>
  <body>

    <div id="tela-login">
      <div class="login-box">
        <img src="https://i.postimg.cc/YSV5B7jW/Logo-Nova-Cor-200.png" alt="Logo">
        <h2>Acesso Restrito</h2>
        <form id="form-login">
          <div class="input-group">
            <label>E-mail do Locutor</label>
            <input type="email" id="login-email" required placeholder="locutor@radiacao.net">
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input type="password" id="login-senha" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-login" id="btn-entrar">Entrar <i class="fas fa-sign-in-alt"></i></button>
          <div id="msg-erro"><i class="fas fa-exclamation-triangle"></i> E-mail ou senha incorretos!</div>
        </form>
      </div>
    </div>

    <div id="tela-dashboard">
      <div class="title-wrapper">
        <img src="https://i.postimg.cc/YSV5B7jW/Logo-Nova-Cor-200.png" class="logo-img" alt="Logo">
        <h1 class="floating-title">Painel do Locutor</h1>
        <div style="display: flex; gap: 5px; margin-left: auto; align-items: center; flex-wrap: wrap; justify-content: flex-end;">
          <div class="status-badge" id="badgeStatus"><span class="pulse-dot" id="dotStatus"></span><span id="textStatus">A ligar...</span></div>
          <button class="btn-topo btn-alertas inativo" id="btn-alertas" title="Clique para ativar sons e alertas"><i class="fas fa-bell-slash"></i></button>
          <button class="btn-topo btn-instalar-app" id="btn-instalar-painel" title="Instalar App"><i class="fas fa-download"></i> App</button>
          <button class="btn-topo" id="btn-logout" title="Sair do Painel"><i class="fas fa-power-off"></i> Sair</button>
        </div>
      </div>

      <div class="dashboard-grid">
        
        <!-- COLUNA ESQUERDA: STATUS E ENQUETE (Lado a lado no RadioBOSS) -->
        <div class="dash-sidebar">
          
          <div class="pedidos-wrapper">
            <h2 class="section-title">Status da Rádio <i class="fas fa-broadcast-tower" style="color: #f4741f;"></i></h2>
            <div class="pedido-card" style="border-left-color: #2196F3;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">
                <div style="font-weight: 900; color: #2196F3; font-size: 0.85rem; text-transform: uppercase;">
                  <i class="fas fa-info-circle"></i> Tocando Agora
                </div>
                <div style="background: rgba(33, 150, 243, 0.15); border: 1px solid rgba(33, 150, 243, 0.4); color: #2196F3; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; gap: 6px;">
                  <i class="fas fa-users"></i> <span id="painelListeners">0</span> Ouvintes
                </div>
              </div>
              <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;">
                <li style="display: flex; align-items: flex-start; gap: 10px;">
                  <i class="fas fa-music" style="color: #aaa; margin-top: 3px; font-size: 0.9rem;"></i>
                  <div style="display: flex; flex-direction: column; gap: 2px;">
                    <span id="painelLine1" style="font-weight: 900; color: #fff; font-size: 1.05rem; line-height: 1.2;">A carregar...</span>
                    <span id="painelLine2" style="font-size: 0.85rem; color: #f4741f; font-weight: 700;">A ligar ao servidor</span>
                  </div>
                </li>
                <li id="li-album" style="display: none; align-items: center; gap: 10px; color: #888; font-size: 0.8rem; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 6px;">
                  <i class="fas fa-compact-disc"></i> <span id="painelLine3"></span>
                </li>
              </ul>
            </div>
          </div>

          <div class="pedidos-wrapper">
            <h2 class="section-title">Enquete ao Vivo <i class="fas fa-poll" style="color: #f4741f;"></i></h2>
            <div id="enquete-container" style="height: 100%;">
              <div class="pedido-card">
                <div class="sem-pedidos"><i class="fas fa-spinner fa-spin"></i> Conectando à Enquete...</div>
              </div>
            </div>
          </div>
        </div>

        <!-- COLUNA DIREITA: PEDIDOS -->
        <div class="dash-right-col">
          <div class="pedidos-wrapper" style="margin-bottom: 0; display: flex; flex-direction: column; height: 100%;">
            <h2 class="section-title">Fila de Pedidos <i class="fas fa-inbox" style="color: #f4741f;"></i></h2>
            <div class="dash-main-box">
              <div class="lista-pedidos" id="container-pedidos">
                <div class="sem-pedidos"><i class="fas fa-spinner fa-spin"></i> A carregar pedidos...</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script>
      let deferredPromptPainel;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); deferredPromptPainel = e; document.getElementById('btn-instalar-painel').style.display = 'flex';
      });
      document.getElementById('btn-instalar-painel').addEventListener('click', async () => {
        if (deferredPromptPainel) {
          deferredPromptPainel.prompt();
          const { outcome } = await deferredPromptPainel.userChoice;
          if (outcome === 'accepted') { document.getElementById('btn-instalar-painel').style.display = 'none'; }
          deferredPromptPainel = null;
        }
      });

      async function atualizarInfoRadio() {
        try {
          const urlBusca = 'https://painel.radiacao.net.br/api/nowplaying_static/radiacaonet.json?_=' + new Date().getTime();
          const response = await fetch(urlBusca, { cache: 'no-store' });
          const data = await response.json();
          
          document.getElementById('painelLine1').innerText = data.now_playing.song.title || "Desconhecido";
          document.getElementById('painelLine2').innerText = data.now_playing.song.artist || "Desconhecido";
          document.getElementById('painelListeners').innerText = data.listeners.current || 0;
          
          const songAlbum = data.now_playing.song.album || "";
          const line3 = document.getElementById('painelLine3');
          const liAlbum = document.getElementById('li-album');
          if (songAlbum) { line3.innerText = songAlbum; liAlbum.style.display = 'flex'; } else { liAlbum.style.display = 'none'; }

          const isLive = data.live.is_live;
          const badgeStatus = document.getElementById('badgeStatus');
          const textStatus = document.getElementById('textStatus');
          const dotStatus = document.getElementById('dotStatus');

          if (isLive) {
            badgeStatus.className = "status-badge status-online"; textStatus.innerText = "Online"; dotStatus.className = "pulse-dot dot-green";
          } else {
            badgeStatus.className = "status-badge status-autodj"; textStatus.innerText = "Auto DJ"; dotStatus.className = "pulse-dot dot-red";
          }
        } catch (error) { console.error("Erro na rádio:", error); }
      }
      setInterval(atualizarInfoRadio, 5000);
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
      import { getDatabase, ref, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDLCYfYApZZt4ycMmr-f4Xq002ZBalYmdU",
        authDomain: "radiacaonet.firebaseapp.com",
        databaseURL: "https://radiacaonet-default-rtdb.firebaseio.com",
        projectId: "radiacaonet",
        storageBucket: "radiacaonet.firebasestorage.app",
        messagingSenderId: "1078838815128",
        appId: "1:1078838815128:web:20de30c5ad574a59dd23ed"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const pedidosRef = ref(db, 'pedidos');
      const enqueteRef = ref(db, 'enquete_atual');

      const telaLogin = document.getElementById('tela-login');
      const telaDashboard = document.getElementById('tela-dashboard');
      const formLogin = document.getElementById('form-login');
      const msgErro = document.getElementById('msg-erro');
      const btnEntrar = document.getElementById('btn-entrar');
      const container = document.getElementById('container-pedidos');
      const btnAlertas = document.getElementById('btn-alertas');
      const containerEnquete = document.getElementById('enquete-container');

      const notificationSound = new Audio('https://actions.google.com/sounds/v1/ui/bubble_pop.ogg');
      let cargaInicial = true; let quantidadePedidosAnterior = 0; let intervaloPiscar; let isBlinking = false; let alertasAtivados = false;

      function habilitarAlertas() {
        if (alertasAtivados) return;
        notificationSound.play().then(() => { notificationSound.pause(); notificationSound.currentTime = 0; }).catch(err => console.log("Áudio bloqueado", err));
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") { Notification.requestPermission(); }
        alertasAtivados = true;
        btnAlertas.className = "btn-topo btn-alertas ativo"; btnAlertas.innerHTML = '<i class="fas fa-bell"></i>'; btnAlertas.title = "Alertas Sonoros Ativados";
      }

      window.addEventListener('click', habilitarAlertas, { once: true });
      btnAlertas.addEventListener('click', habilitarAlertas);

      function notificarAba() {
        if(isBlinking) return;
        isBlinking = true; let piscar = false;
        intervaloPiscar = setInterval(() => { document.title = piscar ? "🔔 NOVO PEDIDO!" : "Painel do Locutor"; piscar = !piscar; }, 1000);
        setTimeout(() => { clearInterval(intervaloPiscar); document.title = "Painel do Locutor - Radiação.Net"; isBlinking = false; }, 15000);
      }

      window.addEventListener('focus', () => {
        if (isBlinking) { clearInterval(intervaloPiscar); document.title = "Painel do Locutor - Radiação.Net"; isBlinking = false; }
      });

      onAuthStateChanged(auth, (user) => {
        if (user) { 
          telaLogin.style.display = 'none'; telaDashboard.style.display = 'flex'; 
          atualizarInfoRadio(); iniciarLeituraPedidos(); iniciarControleEnquete(); 
        } 
        else { telaLogin.style.display = 'flex'; telaDashboard.style.display = 'none'; }
      });

      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        habilitarAlertas();
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;
        btnEntrar.innerText = "A verificar... ⏳"; msgErro.style.display = 'none';

        signInWithEmailAndPassword(auth, email, senha)
          .then(() => { btnEntrar.innerHTML = 'Entrar <i class="fas fa-sign-in-alt"></i>'; })
          .catch((error) => { console.error(error); btnEntrar.innerHTML = 'Entrar <i class="fas fa-sign-in-alt"></i>'; msgErro.style.display = 'block'; });
      });

      document.getElementById('btn-logout').addEventListener('click', () => { signOut(auth).catch((error) => console.error("Erro", error)); });

      window.criarEnquete = function() {
        const pergunta = document.getElementById('enq-pergunta').value;
        const op1 = document.getElementById('enq-op1').value;
        const op2 = document.getElementById('enq-op2').value;

        if(!pergunta || !op1 || !op2) { alert("Preencha a pergunta e as duas opções!"); return; }

        set(enqueteRef, {
            ativa: true, pergunta: pergunta,
            opcoes: { op1: { texto: op1, votos: 0 }, op2: { texto: op2, votos: 0 } }
        });
      };

      window.encerrarEnquete = function() { update(enqueteRef, { ativa: false }); };

      function iniciarControleEnquete() {
          onValue(enqueteRef, (snapshot) => {
              const data = snapshot.val();
              if (data && data.ativa) {
                  const votos1 = data.opcoes.op1.votos || 0;
                  const votos2 = data.opcoes.op2.votos || 0;
                  const totalVotos = votos1 + votos2;
                  const perc1 = totalVotos === 0 ? 0 : Math.round((votos1 / totalVotos) * 100);
                  const perc2 = totalVotos === 0 ? 0 : Math.round((votos2 / totalVotos) * 100);

                  containerEnquete.innerHTML = `
                      <div class="pedido-card" style="border-left-color: #4caf50; height: 100%;">
                          <div style="font-weight: 900; color: #4caf50; font-size: 0.8rem; margin-bottom: 5px;">
                              <i class="fas fa-broadcast-tower blink"></i> ENQUETE NO AR
                          </div>
                          <p style="font-weight: 700; font-size: 1.1rem; color: #fff; margin-bottom: 15px;">${data.pergunta}</p>
                          <div class="stat-row">
                              <div class="stat-labels"><span>${data.opcoes.op1.texto}</span> <span>${perc1}% (${votos1})</span></div>
                              <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${perc1}%;"></div></div>
                          </div>
                          <div class="stat-row">
                              <div class="stat-labels"><span>${data.opcoes.op2.texto}</span> <span>${perc2}% (${votos2})</span></div>
                              <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${perc2}%;"></div></div>
                          </div>
                          <div style="text-align: center; font-size: 0.8rem; color: #aaa; margin-top: 5px;">Total de votos: ${totalVotos}</div>
                          <button class="btn-encerrar" onclick="encerrarEnquete()"><i class="fas fa-stop-circle"></i> Encerrar Votação</button>
                      </div>
                  `;
              } else {
                  containerEnquete.innerHTML = `
                      <div class="pedido-card" style="height: 100%;">
                          <p style="margin-bottom: 12px; font-size: 0.85rem; color: #aaa;">Preencha os campos para iniciar uma batalha de bandas com os ouvintes:</p>
                          <div class="enquete-form">
                              <input type="text" id="enq-pergunta" class="enquete-input" placeholder="Pergunta (Ex: Qual clássico fecha?)">
                              <input type="text" id="enq-op1" class="enquete-input" placeholder="Opção 1 (Ex: Iron Maiden)">
                              <input type="text" id="enq-op2" class="enquete-input" placeholder="Opção 2 (Ex: Metallica)">
                              <button class="btn-enquete" onclick="criarEnquete()"><i class="fas fa-play"></i> Colocar no Ar</button>
                          </div>
                      </div>
                  `;
              }
          });
      }

      function iniciarLeituraPedidos() {
        onValue(pedidosRef, (snapshot) => {
          container.innerHTML = ''; 
          const dados = snapshot.val();

          if (dados) {
            const chaves = Object.keys(dados).reverse();
            const quantidadeAtual = chaves.length;

            if (!cargaInicial && quantidadeAtual > quantidadePedidosAnterior) {
               if(alertasAtivados) { notificationSound.currentTime = 0; notificationSound.play().catch(e => console.log("Áudio block", e)); }
               notificarAba();
               if ("Notification" in window && Notification.permission === "granted") {
                 const pedidoNovo = dados[chaves[0]];
                 new Notification("Radiação.Net - Novo Pedido!", { body: `${pedidoNovo.nome} pediu: ${pedidoNovo.musica}`, icon: "https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png" });
               }
            }
            
            quantidadePedidosAnterior = quantidadeAtual; cargaInicial = false;

            chaves.forEach(chave => {
              const pedido = dados[chave];
              const card = document.createElement('div');
              card.className = 'pedido-card';
              let htmlCard = `<div class="pedido-hora"><i class="far fa-clock"></i> ${pedido.data_hora || ''}</div><div class="pedido-nome"><i class="fas fa-user-circle"></i> ${pedido.nome} pediu:</div><div class="pedido-musica">${pedido.musica}</div>`;
              if (pedido.recado && pedido.recado.trim() !== '') { htmlCard += `<div class="pedido-recado">" ${pedido.recado} "</div>`; }
              htmlCard += `<button class="btn-concluir" data-id="${chave}"><i class="fas fa-check-circle"></i> Marcar como Tocado</button>`;
              card.innerHTML = htmlCard; container.appendChild(card);
            });

            document.querySelectorAll('.btn-concluir').forEach(btn => {
              btn.addEventListener('click', (e) => {
                const id = e.target.closest('button').dataset.id; e.target.closest('.pedido-card').style.opacity = '0';
                setTimeout(() => remove(ref(db, `pedidos/${id}`)), 300); quantidadePedidosAnterior--; 
              });
            });
          } else {
            quantidadePedidosAnterior = 0; cargaInicial = false;
            container.innerHTML = `<div class="sem-pedidos"><i class="fas fa-inbox fa-3x" style="margin-bottom: 15px; color: #555;"></i><br>A fila está vazia. A aguardar novos pedidos...</div>`;
          }
        });
      }
    </script>
  </body>
</html>
