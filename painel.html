<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Locutor - Radiação.Net</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- IMPORTANDO O CSS DO SITE PRINCIPAL -->
    <link rel="stylesheet" href="./style.css">
    
    <style>
      body { justify-content: flex-start !important; padding-top: 30px !important; }
      
      /* --- ECRÃ DE LOGIN --- */
      #tela-login {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%; height: 80vh; z-index: 1000;
      }
      .login-box {
        background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #f4741f;
        padding: 40px 30px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        width: 100%; max-width: 400px; text-align: center;
      }
      .login-box img { width: 80px; margin-bottom: 20px; }
      .login-box h2 { font-weight: 900; margin-bottom: 25px; color: #fff; }
      .input-group { margin-bottom: 15px; text-align: left; }
      .input-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 5px; font-weight: 700; }
      .input-group input {
        width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
        background: rgba(0,0,0,0.5); color: #fff; font-family: inherit; font-size: 1rem;
      }
      .input-group input:focus { outline: none; border-color: #f4741f; }
      .btn-login {
        width: 100%; padding: 14px; border: none; border-radius: 8px; background: #f4741f;
        color: #fff; font-weight: 900; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
      }
      .btn-login:hover { background: #ff8c42; }
      #msg-erro { color: #ff4c4c; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: bold; }

      /* --- ECRÃ DO DASHBOARD --- */
      #tela-dashboard { display: none; width: 100%; max-width: 1000px; margin: 0 auto; flex-direction: column; gap: 15px; }

      .title-wrapper, .custom-player-wrapper { max-width: 1000px !important; }
      @media (max-width: 480px) { .floating-title { font-size: 1.4rem !important; } }

      /* Estilos dinâmicos da Badge de Status */
      .status-badge {
        padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold;
        display: flex; align-items: center; gap: 6px; flex-shrink: 0; transition: all 0.3s ease;
      }
      .status-online {
        background-color: rgba(46, 125, 50, 0.2); border: 1px solid rgba(76, 175, 80, 0.5); color: #4caf50;
      }
      .status-autodj {
        background-color: rgba(255, 76, 76, 0.2); border: 1px solid rgba(255, 76, 76, 0.5); color: #ff4c4c;
      }
      .pulse-dot {
        width: 6px; height: 6px; border-radius: 50%; animation: blink 1s infinite alternate;
      }
      .dot-green { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
      .dot-red { background: #ff4c4c; box-shadow: 0 0 6px #ff4c4c; }

      .btn-sair {
        background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold;
        cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 6px; margin-left: 10px;
      }
      .btn-sair:hover { background: rgba(255, 255, 255, 0.2); }

      .listeners-block {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(244, 116, 31, 0.15); border: 1px solid rgba(244, 116, 31, 0.4);
        padding: 8px 20px; border-radius: 12px; min-width: 90px;
      }
      .listeners-count { font-size: 1.6rem; font-weight: 900; color: #fff; line-height: 1; }
      .listeners-label { font-size: 0.65rem; color: #f4741f; font-weight: 700; text-transform: uppercase; margin-top: 4px;}

      .pedidos-wrapper { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; margin-bottom: 40px; }
      .section-title { font-size: 1.1rem; font-weight: 900; color: #fff; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
      .section-title::after { content: ''; flex-grow: 1; height: 1px; background: rgba(255,255,255,0.1); margin-left: 10px; }

      .lista-pedidos { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) !important; gap: 15px; align-items: start; }
      
      .pedido-card {
        background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 4px solid #f4741f; border-radius: 12px; padding: 12px 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        display: flex; flex-direction: column; gap: 6px; transition: opacity 0.3s ease; width: 100%;
      }
      
      .pedido-hora { font-size: 0.7rem; color: #888; text-align: right; margin-top: -2px; font-weight: 700;}
      .pedido-nome { font-weight: 700; color: #f4741f; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;}
      .pedido-musica { font-size: 1rem; font-weight: 900; color: #fff; line-height: 1.2;}
      .pedido-recado { font-size: 0.75rem; color: #ddd; font-style: italic; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; border-left: 2px solid #666; margin-top: 2px;}
      
      .btn-concluir {
        background: rgba(244, 116, 31, 0.1); border: 1px solid rgba(244, 116, 31, 0.4); color: #f4741f;
        padding: 8px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.8rem;
        transition: all 0.3s; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .btn-concluir:hover { background: #f4741f; color: #fff; border-color: #f4741f; }
      
      .sem-pedidos { text-align: center; color: #888; font-size: 1rem; padding: 30px 0; background: rgba(20,20,20,0.5); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); grid-column: 1 / -1; }
    </style>
  </head>
  <body>

    <!-- ================= ECRÃ DE LOGIN ================= -->
    <div id="tela-login">
      <div class="login-box">
        <img src="https://i.postimg.cc/YSV5B7jW/Logo-Nova-Cor-200.png" alt="Logo">
        <h2>Acesso Restrito</h2>
        <form id="form-login">
          <div class="input-group">
            <label>E-mail do Locutor</label>
            <input type="email" id="login-email" required placeholder="locutor@radiacao.net">
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input type="password" id="login-senha" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-login" id="btn-entrar">Entrar <i class="fas fa-sign-in-alt"></i></button>
          <div id="msg-erro"><i class="fas fa-exclamation-triangle"></i> E-mail ou senha incorretos!</div>
        </form>
      </div>
    </div>

    <!-- ================= ECRÃ DO DASHBOARD ================= -->
    <div id="tela-dashboard">
      <!-- CABEÇALHO -->
      <div class="title-wrapper">
        <img src="https://i.postimg.cc/YSV5B7jW/Logo-Nova-Cor-200.png" class="logo-img" alt="Logo">
        <h1 class="floating-title">Painel do Locutor</h1>
        <div style="display: flex; gap: 10px; margin-left: auto; align-items: center;">
          <!-- A badge começa cinzenta/neutra, o JS atualiza imediatamente -->
          <div class="status-badge" id="badgeStatus">
            <span class="pulse-dot" id="dotStatus"></span>
            <span id="textStatus">A ligar...</span>
          </div>
          <button class="btn-sair" id="btn-logout"><i class="fas fa-power-off"></i> Sair</button>
        </div>
      </div>

      <!-- CARD INFORMATIVO -->
      <div class="custom-player-wrapper">
        <div class="player-cover-container">
          <img id="painelCover" src="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png" alt="Capa" class="player-cover">
        </div>
        <div class="player-track-info">
          <div class="song-title" id="painelLine1">A carregar...</div>
          <div class="song-artist" id="painelLine2">A ligar ao servidor</div>
          <div class="song-album" id="painelLine3"></div>
        </div>
        <div class="player-controls-right">
          <div class="listeners-block">
            <span class="listeners-count" id="painelListeners">0</span>
            <div class="listeners-label">Ouvintes</div>
          </div>
        </div>
      </div>

      <!-- SESSÃO DE PEDIDOS -->
      <div class="pedidos-wrapper">
        <h2 class="section-title">Fila de Pedidos <i class="fas fa-inbox" style="color: #f4741f;"></i></h2>
        <div class="lista-pedidos" id="container-pedidos">
          <div class="sem-pedidos"><i class="fas fa-spinner fa-spin"></i> A carregar pedidos...</div>
        </div>
      </div>
    </div>

    <!-- SCRIPT 1: BUSCAR DADOS DA RÁDIO E ATUALIZAR STATUS -->
    <script>
      async function atualizarInfoRadio() {
        try {
          const response = await fetch('https://painel.radiacao.net.br/api/nowplaying_static/radiacaonet.json');
          const data = await response.json();
          
          // --- ATUALIZAÇÃO DOS DADOS DA FAIXA E OUVINTES ---
          document.getElementById('painelCover').src = data.now_playing.song.art || 'https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png';
          document.getElementById('painelLine1').innerText = data.now_playing.song.title || "Desconhecido";
          document.getElementById('painelLine2').innerText = data.now_playing.song.artist || "Desconhecido";
          document.getElementById('painelListeners').innerText = data.listeners.current || 0;
          
          const songAlbum = data.now_playing.song.album || "";
          const line3 = document.getElementById('painelLine3');
          if (songAlbum) { 
            line3.innerText = `💿 ${songAlbum}`; 
            line3.style.display = 'block'; 
            line3.style.color = '#bbbbbb'; 
          } else { 
            line3.style.display = 'none'; 
          }

          // --- NOVA LÓGICA: ATUALIZAÇÃO DA BADGE (Online vs Auto DJ) ---
          const isLive = data.live.is_live;
          const badgeStatus = document.getElementById('badgeStatus');
          const textStatus = document.getElementById('textStatus');
          const dotStatus = document.getElementById('dotStatus');

          if (isLive) {
            // Status Verde: Locutor Online
            badgeStatus.className = "status-badge status-online";
            textStatus.innerText = "Online";
            dotStatus.className = "pulse-dot dot-green";
          } else {
            // Status Vermelho: Auto DJ a funcionar
            badgeStatus.className = "status-badge status-autodj";
            textStatus.innerText = "Auto DJ";
            dotStatus.className = "pulse-dot dot-red";
          }

        } catch (error) { 
          console.error("Erro na rádio:", error); 
        }
      }
      setInterval(atualizarInfoRadio, 10000);
    </script>

    <!-- SCRIPT 2: FIREBASE AUTH E DATABASE -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
      import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

      // AS SUAS CHAVES DO FIREBASE MANTIDAS
      const firebaseConfig = {
        apiKey: "AIzaSyDLCYfYApZZt4ycMmr-f4Xq002ZBalYmdU",
        authDomain: "radiacaonet.firebaseapp.com",
        databaseURL: "https://radiacaonet-default-rtdb.firebaseio.com",
        projectId: "radiacaonet",
        storageBucket: "radiacaonet.firebasestorage.app",
        messagingSenderId: "1078838815128",
        appId: "1:1078838815128:web:20de30c5ad574a59dd23ed"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const pedidosRef = ref(db, 'pedidos');

      const telaLogin = document.getElementById('tela-login');
      const telaDashboard = document.getElementById('tela-dashboard');
      const formLogin = document.getElementById('form-login');
      const msgErro = document.getElementById('msg-erro');
      const btnEntrar = document.getElementById('btn-entrar');
      const container = document.getElementById('container-pedidos');

      // 1. MONITOR DE ESTADO DE LOGIN
      onAuthStateChanged(auth, (user) => {
        if (user) {
          telaLogin.style.display = 'none';
          telaDashboard.style.display = 'flex';
          atualizarInfoRadio(); // Atualiza a rádio e a badge imediatamente ao entrar
          iniciarLeituraPedidos();
        } else {
          telaLogin.style.display = 'flex';
          telaDashboard.style.display = 'none';
        }
      });

      // 2. FUNÇÃO DE LOGIN
      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;
        
        btnEntrar.innerText = "A verificar... ⏳";
        msgErro.style.display = 'none';

        signInWithEmailAndPassword(auth, email, senha)
          .then(() => {
            btnEntrar.innerHTML = 'Entrar <i class="fas fa-sign-in-alt"></i>';
          })
          .catch((error) => {
            console.error(error);
            btnEntrar.innerHTML = 'Entrar <i class="fas fa-sign-in-alt"></i>';
            msgErro.style.display = 'block';
          });
      });

      // 3. FUNÇÃO DE LOGOUT
      document.getElementById('btn-logout').addEventListener('click', () => {
        signOut(auth).catch((error) => console.error("Erro ao sair", error));
      });

      // 4. LER PEDIDOS
      function iniciarLeituraPedidos() {
        onValue(pedidosRef, (snapshot) => {
          container.innerHTML = ''; 
          const dados = snapshot.val();

          if (dados) {
            const chaves = Object.keys(dados).reverse();
            chaves.forEach(chave => {
              const pedido = dados[chave];
              const card = document.createElement('div');
              card.className = 'pedido-card';
              
              let htmlCard = `
                <div class="pedido-hora"><i class="far fa-clock"></i> ${pedido.data_hora || ''}</div>
                <div class="pedido-nome"><i class="fas fa-user-circle"></i> ${pedido.nome} pediu:</div>
                <div class="pedido-musica">${pedido.musica}</div>
              `;
              if (pedido.recado && pedido.recado.trim() !== '') {
                htmlCard += `<div class="pedido-recado">" ${pedido.recado} "</div>`;
              }
              htmlCard += `<button class="btn-concluir" data-id="${chave}"><i class="fas fa-check-circle"></i> Marcar como Tocado</button>`;
              
              card.innerHTML = htmlCard;
              container.appendChild(card);
            });

            document.querySelectorAll('.btn-concluir').forEach(btn => {
              btn.addEventListener('click', (e) => {
                const id = e.target.closest('button').dataset.id;
                e.target.closest('.pedido-card').style.opacity = '0';
                setTimeout(() => remove(ref(db, `pedidos/${id}`)), 300);
              });
            });
          } else {
            container.innerHTML = `
              <div class="sem-pedidos">
                <i class="fas fa-inbox fa-3x" style="margin-bottom: 15px; color: #555;"></i><br>
                A fila está vazia. A aguardar novos pedidos...
              </div>`;
          }
        });
      }
    </script>
  </body>
</html>
