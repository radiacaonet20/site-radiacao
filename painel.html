<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Locutor - Radiação.Net</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png">
    
    <link rel="manifest" href="./manifest-painel.json">
    <meta name="theme-color" content="#09090b">

    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS global -->
    <link rel="stylesheet" href="./style.css?v=2.2">
    
    <style>
      /* --- TEMA DISCLOUD COM FUNDO DA RÁDIO --- */
      :root {
        --bg-body: #09090b;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-main: #fafafa;
        --text-muted: #a1a1aa;
        --accent-orange: #f4741f;
        --accent-green: #22c55e;
        --accent-blue: #3b82f6;
        --bg-hover: rgba(255, 255, 255, 0.05);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        font-family: 'Inter', sans-serif; 
        color: var(--text-main); 
        min-height: 100vh; 
        padding: 30px 20px 20px 20px; 
        display: flex; 
        flex-direction: column; 
        align-items: center;
        justify-content: flex-start !important; /* <-- AQUI ESTÁ A CORREÇÃO QUE COLA NO TOPO */
        
        /* Imagem de fundo escurecida */
        background-color: #000;
        background-image: linear-gradient(rgba(9, 9, 11, 0.85), rgba(9, 9, 11, 0.85)), url('https://painel.radiacao.net.br/static/uploads/radiacaonet/background.1779332336.webp') !important;
        background-size: cover !important;
        background-position: center !important;
        background-attachment: fixed !important;
      }

      input, button, textarea { font-family: 'Inter', sans-serif; }

      /* --- LOGIN --- */
      #tela-login { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 85vh; z-index: 1000; }
      .login-box { 
        background: rgba(24, 24, 27, 0.65); 
        backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px); 
        border: 1px solid var(--border-color); 
        padding: 40px 30px; 
        border-radius: 12px; 
        width: 100%; 
        max-width: 380px; 
        text-align: center; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
      }
      .login-box img { width: 60px; margin-bottom: 15px; border-radius: 10px; }
      .login-box h2 { font-weight: 600; margin-bottom: 25px; color: var(--text-main); font-size: 1.3rem; }
      .input-group { margin-bottom: 15px; text-align: left; }
      .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
      .input-group input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.5); color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; }
      .input-group input:focus { border-color: var(--accent-orange); }
      .btn-login { width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--accent-orange); color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
      .btn-login:hover { filter: brightness(1.1); }
      #msg-erro { color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: 500; }

      /* --- DASHBOARD WRAPPER --- */
      #tela-dashboard { display: none; width: 100%; max-width: 1400px; margin: 0 auto; flex-direction: column; gap: 20px; }

      /* --- HEADER --- */
      .top-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 10px; flex-wrap: wrap; gap: 15px; }
      .brand-area { display: flex; align-items: center; gap: 15px; }
      .brand-area img { width: 40px; border-radius: 8px; }
      .brand-titles { display: flex; flex-direction: column; }
      .brand-titles h1 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); line-height: 1.2; display: flex; align-items: center; gap: 10px; margin: 0; }
      .brand-sub { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; margin-top: 2px; }

      .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); }
      .dot { width: 8px; height: 8px; border-radius: 50%; animation: blink 1s infinite alternate; }
      .dot.green { background-color: var(--accent-green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
      .dot.red { background-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
      @keyframes blink { from { opacity: 0.6; } to { opacity: 1; } }
      
      .actions-area { display: flex; align-items: center; gap: 8px; }
      .btn-flat { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
      .btn-flat:hover { background: var(--bg-hover); }
      .btn-flat.active { border-color: var(--accent-green); color: var(--accent-green); background: rgba(34, 197, 94, 0.1); }

      /* --- GRID LAYOUT --- */
      .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; width: 100%; }
      .left-col { display: flex; flex-direction: column; gap: 20px; }
      .right-col { display: flex; flex-direction: column; height: 100%; }
      
      @media (max-width: 1100px) {
        .dashboard-grid { grid-template-columns: 1fr; }
        .left-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      }
      @media (max-width: 650px) { .left-col { display: flex; flex-direction: column; } }

      /* --- CARDS (VIDRO FUMÊ) --- */
      .card { 
        background: rgba(24, 24, 27, 0.65); 
        backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px); 
        border: 1px solid var(--border-color); 
        border-radius: 8px; 
        padding: 20px; 
        display: flex; 
        flex-direction: column; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }
      .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
      .card-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
      .card-title i { font-size: 0.9rem; }

      .status-info { display: flex; flex-direction: column; gap: 15px; }
      .info-block { display: flex; align-items: flex-start; gap: 12px; }
      .info-icon { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
      .info-texts { display: flex; flex-direction: column; min-width: 0; }
      .info-value { font-size: 0.95rem; font-weight: 700; color: var(--text-main); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .info-label { font-size: 0.75rem; color: var(--accent-orange); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .enquete-form { display: flex; flex-direction: column; gap: 8px; }
      .input-flat { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.4); color: var(--text-main); font-size: 0.85rem; outline: none; }
      .input-flat:focus { border-color: var(--accent-orange); }
      .btn-primary { background: var(--accent-orange); color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; margin-top: 5px; }
      .btn-danger { background: rgba(0,0,0,0.3); border: 1px solid #ef4444; color: #ef4444; padding: 8px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; margin-top: 15px; width: 100%; }
      .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
      
      .stat-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
      .stat-labels { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--text-main); }
      .stat-bar-bg { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); height: 8px; border-radius: 4px; overflow: hidden; }
      .stat-bar-fill { height: 100%; background: var(--accent-orange); width: 0%; transition: width 0.8s ease; }

      .pedidos-list { display: flex; flex-direction: column; }
      .pedido-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); gap: 15px; animation: fadeIn 0.3s ease; }
      .pedido-row:last-child { border-bottom: none; padding-bottom: 0; }
      
      .pedido-left { display: flex; align-items: flex-start; gap: 12px; flex-grow: 1; min-width: 0; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-blue); margin-top: 5px; flex-shrink: 0; box-shadow: 0 0 5px var(--accent-blue); }
      
      .pedido-info { display: flex; flex-direction: column; min-width: 0; }
      .pedido-musica { font-size: 0.95rem; font-weight: 600; color: var(--text-main); line-height: 1.2; }
      .pedido-autor { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
      .pedido-autor span { color: var(--accent-orange); font-weight: 500; }
      .pedido-recado { font-size: 0.75rem; color: #ddd; font-style: italic; margin-top: 4px; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; border-left: 2px solid var(--border-color); display: inline-block; }
      
      .pedido-right { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
      .pedido-hora { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
      .btn-concluir { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: 0.2s; }
      .btn-concluir:hover { background: var(--bg-hover); color: var(--accent-green); border-color: var(--accent-green); }

      .empty-state { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 40px 0; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login">
      <div class="login-box">
        <img src="https://i.postimg.cc/YSV5B7jW/Logo-Nova-Cor-200.png" alt="Logo">
        <h2>Acesso ao Sistema</h2>
        <form id="form-login">
          <div class="input-group">
            <label>E-mail do Locutor</label>
            <input type="email" id="login-email" required placeholder="locutor@radiacao.net">
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input type="password" id="login-senha" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-login" id="btn-entrar">Autenticar</button>
          <div id="msg-erro"><i class="fas fa-exclamation-triangle"></i> E-mail ou senha incorretos!</div>
        </form>
      </div>
    </div>

    <!-- TELA PRINCIPAL (DASHBOARD) -->
    <div id="tela-dashboard">
      
      <!-- CABEÇALHO ESTILO DISCLOUD -->
      <header class="top-header">
        <div class="brand-area">
          <img src="https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png" id="painelCover" alt="Logo">
          <div class="brand-titles">
            <h1>Painel do Locutor 
              <div class="status-badge" id="badgeStatus"><div class="dot red" id="dotStatus"></div> <span id="textStatus">Desconectado</span></div>
            </h1>
            <div class="brand-sub"><i class="fas fa-server"></i> radiacaonet / admin</div>
          </div>
        </div>
        
        <div class="actions-area">
          <button class="btn-flat" id="btn-alertas" title="Clique para ativar alertas sonoros"><i class="fas fa-bell-slash"></i> Alertas</button>
          <button class="btn-flat" id="btn-instalar-painel" style="display: none;"><i class="fas fa-download"></i> Instalar</button>
          <button class="btn-flat" id="btn-logout"><i class="fas fa-power-off"></i> Sair</button>
        </div>
      </header>

      <!-- CORPO DO PAINEL -->
      <div class="dashboard-grid">
        
        <!-- COLUNA ESQUERDA -->
        <div class="left-col">
          
          <!-- CARD DE STATUS -->
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-memory"></i> Status da Rádio</div></div>
            <div class="status-info">
              
              <div class="info-block">
                <div class="info-icon"><i class="fas fa-music"></i></div>
                <div class="info-texts">
                  <div class="info-value" id="painelLine1">A carregar...</div>
                  <div class="info-label" id="painelLine2">Conectando ao servidor</div>
                </div>
              </div>

              <div class="info-block">
                <div class="info-icon"><i class="fas fa-users"></i></div>
                <div class="info-texts">
                  <div class="info-value" id="painelListeners">0</div>
                  <div class="info-label" style="color: var(--text-muted);">Ouvintes Simultâneos</div>
                </div>
              </div>

            </div>
          </div>

          <!-- CARD DE ENQUETES -->
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-chart-bar"></i> Enquete Ativa</div></div>
            <div id="enquete-container">
              <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Carregando módulo...</div>
            </div>
          </div>
          
        </div>

        <!-- COLUNA DIREITA (PEDIDOS) -->
        <div class="right-col">
          <div class="card" style="height: 100%;">
            <div class="card-header"><div class="card-title"><i class="fas fa-stream"></i> Fila de Pedidos</div></div>
            <div class="pedidos-list" id="container-pedidos">
              <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Sincronizando fila...</div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- SCRIPTS DE AZURACAST E PWA -->
    <script>
      let deferredPromptPainel;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); deferredPromptPainel = e; document.getElementById('btn-instalar-painel').style.display = 'flex';
      });
      document.getElementById('btn-instalar-painel').addEventListener('click', async () => {
        if (deferredPromptPainel) {
          deferredPromptPainel.prompt();
          const { outcome } = await deferredPromptPainel.userChoice;
          if (outcome === 'accepted') { document.getElementById('btn-instalar-painel').style.display = 'none'; }
          deferredPromptPainel = null;
        }
      });

      async function atualizarInfoRadio() {
        try {
          const urlBusca = 'https://painel.radiacao.net.br/api/nowplaying_static/radiacaonet.json?_=' + new Date().getTime();
          const response = await fetch(urlBusca, { cache: 'no-store' });
          const data = await response.json();
          
          document.getElementById('painelLine1').innerText = data.now_playing.song.title || "Desconhecido";
          document.getElementById('painelLine2').innerText = data.now_playing.song.artist || "Desconhecido";
          document.getElementById('painelListeners').innerText = data.listeners.current || 0;
          
          const coverUrl = data.now_playing.song.art || 'https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png';
          document.getElementById('painelCover').src = coverUrl;

          const isLive = data.live.is_live;
          const textStatus = document.getElementById('textStatus');
          const dotStatus = document.getElementById('dotStatus');

          if (isLive) {
            textStatus.innerText = "AO VIVO"; dotStatus.className = "dot green";
          } else {
            textStatus.innerText = "Auto DJ"; dotStatus.className = "dot red";
          }
        } catch (error) { console.error("Erro na rádio:", error); }
      }
      setInterval(atualizarInfoRadio, 5000);
    </script>

    <!-- FIREBASE (SEUS DADOS ORIGINAIS) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
      import { getDatabase, ref, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDLCYfYApZZt4ycMmr-f4Xq002ZBalYmdU",
        authDomain: "radiacaonet.firebaseapp.com",
        databaseURL: "https://radiacaonet-default-rtdb.firebaseio.com",
        projectId: "radiacaonet",
        storageBucket: "radiacaonet.firebasestorage.app",
        messagingSenderId: "1078838815128",
        appId: "1:1078838815128:web:20de30c5ad574a59dd23ed"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const pedidosRef = ref(db, 'pedidos');
      const enqueteRef = ref(db, 'enquete_atual');

      const telaLogin = document.getElementById('tela-login');
      const telaDashboard = document.getElementById('tela-dashboard');
      const formLogin = document.getElementById('form-login');
      const msgErro = document.getElementById('msg-erro');
      const btnEntrar = document.getElementById('btn-entrar');
      const container = document.getElementById('container-pedidos');
      const btnAlertas = document.getElementById('btn-alertas');
      const containerEnquete = document.getElementById('enquete-container');

      const notificationSound = new Audio('https://actions.google.com/sounds/v1/ui/bubble_pop.ogg');
      let cargaInicial = true; let quantidadePedidosAnterior = 0; let intervaloPiscar; let isBlinking = false; let alertasAtivados = false;

      function habilitarAlertas() {
        if (alertasAtivados) return;
        notificationSound.play().then(() => { notificationSound.pause(); notificationSound.currentTime = 0; }).catch(err => console.log("Áudio bloqueado", err));
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") { Notification.requestPermission(); }
        alertasAtivados = true;
        btnAlertas.classList.add("active"); 
        btnAlertas.innerHTML = '<i class="fas fa-bell"></i> Alertas On';
      }

      window.addEventListener('click', habilitarAlertas, { once: true });
      btnAlertas.addEventListener('click', habilitarAlertas);

      function notificarAba() {
        if(isBlinking) return;
        isBlinking = true; let piscar = false;
        intervaloPiscar = setInterval(() => { document.title = piscar ? "🔔 NOVO PEDIDO!" : "Painel do Locutor"; piscar = !piscar; }, 1000);
        setTimeout(() => { clearInterval(intervaloPiscar); document.title = "Painel do Locutor - Radiação.Net"; isBlinking = false; }, 15000);
      }

      window.addEventListener('focus', () => {
        if (isBlinking) { clearInterval(intervaloPiscar); document.title = "Painel do Locutor - Radiação.Net"; isBlinking = false; }
      });

      onAuthStateChanged(auth, (user) => {
        if (user) { 
          telaLogin.style.display = 'none'; telaDashboard.style.display = 'flex'; 
          atualizarInfoRadio(); iniciarLeituraPedidos(); iniciarControleEnquete(); 
        } 
        else { telaLogin.style.display = 'flex'; telaDashboard.style.display = 'none'; }
      });

      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        habilitarAlertas();
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;
        btnEntrar.innerText = "A verificar... ⏳"; msgErro.style.display = 'none';

        signInWithEmailAndPassword(auth, email, senha)
          .then(() => { btnEntrar.innerText = 'Autenticar'; })
          .catch((error) => { console.error(error); btnEntrar.innerText = 'Autenticar'; msgErro.style.display = 'block'; });
      });

      document.getElementById('btn-logout').addEventListener('click', () => { signOut(auth).catch((error) => console.error("Erro", error)); });

      window.criarEnquete = function() {
        const pergunta = document.getElementById('enq-pergunta').value;
        const op1 = document.getElementById('enq-op1').value;
        const op2 = document.getElementById('enq-op2').value;

        if(!pergunta || !op1 || !op2) { alert("Preencha a pergunta e as duas opções!"); return; }

        set(enqueteRef, {
            ativa: true, pergunta: pergunta,
            opcoes: { op1: { texto: op1, votos: 0 }, op2: { texto: op2, votos: 0 } }
        });
      };

      window.encerrarEnquete = function() { update(enqueteRef, { ativa: false }); };

      function iniciarControleEnquete() {
          onValue(enqueteRef, (snapshot) => {
              const data = snapshot.val();
              if (data && data.ativa) {
                  const votos1 = data.opcoes.op1.votos || 0;
                  const votos2 = data.opcoes.op2.votos || 0;
                  const totalVotos = votos1 + votos2;
                  const perc1 = totalVotos === 0 ? 0 : Math.round((votos1 / totalVotos) * 100);
                  const perc2 = totalVotos === 0 ? 0 : Math.round((votos2 / totalVotos) * 100);

                  containerEnquete.innerHTML = `
                    <div style="margin-bottom: 15px; color: var(--accent-green); font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;"><div class="dot green"></div> NO AR</div>
                    <div style="font-weight: 600; font-size: 1rem; margin-bottom: 15px; line-height: 1.3; color: var(--text-main);">${data.pergunta}</div>
                    <div class="stat-row"><div class="stat-labels"><span>${data.opcoes.op1.texto}</span><span>${perc1}% (${votos1})</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${perc1}%;"></div></div></div>
                    <div class="stat-row"><div class="stat-labels"><span>${data.opcoes.op2.texto}</span><span>${perc2}% (${votos2})</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${perc2}%;"></div></div></div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 5px;">Total: ${totalVotos} votos</div>
                    <button class="btn-danger" onclick="encerrarEnquete()"><i class="fas fa-stop"></i> Encerrar Votação</button>
                  `;
              } else {
                  containerEnquete.innerHTML = `
                    <div class="enquete-form">
                      <input type="text" id="enq-pergunta" class="input-flat" placeholder="Pergunta (Ex: Qual clássico fecha?)">
                      <input type="text" id="enq-op1" class="input-flat" placeholder="Opção 1 (Ex: Iron Maiden)">
                      <input type="text" id="enq-op2" class="input-flat" placeholder="Opção 2 (Ex: Metallica)">
                      <button class="btn-primary" onclick="criarEnquete()">Colocar no Ar</button>
                    </div>
                  `;
              }
          });
      }

      function iniciarLeituraPedidos() {
        onValue(pedidosRef, (snapshot) => {
          container.innerHTML = ''; 
          const dados = snapshot.val();

          if (dados) {
            const chaves = Object.keys(dados).reverse();
            const quantidadeAtual = chaves.length;

            if (!cargaInicial && quantidadeAtual > quantidadePedidosAnterior) {
               if(alertasAtivados) { notificationSound.currentTime = 0; notificationSound.play().catch(e => console.log("Áudio block", e)); }
               notificarAba();
               if ("Notification" in window && Notification.permission === "granted") {
                 const pedidoNovo = dados[chaves[0]];
                 new Notification("Radiação.Net - Novo Pedido!", { body: `${pedidoNovo.nome} pediu: ${pedidoNovo.musica}`, icon: "https://i.postimg.cc/jd7JYYbX/Logo-Nova-Cor-200.png" });
               }
            }
            
            quantidadePedidosAnterior = quantidadeAtual; cargaInicial = false;

            chaves.forEach(chave => {
              const p = dados[chave];
              const row = document.createElement('div');
              row.className = 'pedido-row';
              
              let recadoHtml = p.recado && p.recado.trim() !== '' ? `<div class="pedido-recado">"${p.recado}"</div>` : '';
              
              let html = `
                <div class="pedido-left">
                  <div class="status-dot"></div>
                  <div class="pedido-info">
                    <div class="pedido-musica">${p.musica}</div>
                    <div class="pedido-autor">Pedida por <span>${p.nome}</span></div>
                    ${recadoHtml}
                  </div>
                </div>
                <div class="pedido-right">
                  <div class="pedido-hora">${p.data_hora || ''}</div>
                  <button class="btn-concluir" data-id="${chave}" title="Marcar como tocado"><i class="fas fa-check"></i></button>
                </div>
              `;
              
              row.innerHTML = html; 
              container.appendChild(row);
            });

            document.querySelectorAll('.btn-concluir').forEach(btn => {
              btn.addEventListener('click', (e) => {
                const id = e.currentTarget.dataset.id; 
                e.currentTarget.closest('.pedido-row').style.opacity = '0';
                setTimeout(() => remove(ref(db, `pedidos/${id}`)), 300); 
                quantidadePedidosAnterior--; 
              });
            });
          } else {
            quantidadePedidosAnterior = 0; cargaInicial = false;
            container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox fa-2x" style="margin-bottom: 10px; color: #3f3f46;"></i><br>Nenhum pedido na fila.</div>`;
          }
        });
      }
    </script>
  </body>
</html>
